<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Deportivo - Parte 2</title>
    <link rel="stylesheet" href="estilos.css">

    <script src="socios.js" defer></script>
    <script src="servicios.js" defer></script>
    <script src="testimonios.js" defer></script>
    <script src="noticias.js" defer></script>
    <script src="citas.js" defer></script>
    <script src="pruebas.js" defer></script>
</head>

<body>

    <h1>Club Deportivo</h1>

    <section>

        <h2>Formulario de socios</h2>

        <form id="formSocios" novalidate>

            <label for="nombre">Nombre:</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                minlength="4"
                maxlength="50"
                required
                aria-describedby="errorNombre"
            >
            <p id="errorNombre" class="error"></p>

            <label for="usuario">Nombre de usuario:</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                minlength="5"
                maxlength="20"
                required
                aria-describedby="errorUsuario"
            >
            <p id="errorUsuario" class="error"></p>

            <label for="correo">Correo electrónico:</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required
                aria-describedby="errorCorreo"
            >
            <p id="errorCorreo" class="error"></p>

            <label for="edad">Edad:</label>
            <input
                type="number"
                id="edad"
                name="edad"
                min="18"
                max="100"
                required
                aria-describedby="errorEdad"
            >
            <p id="errorEdad" class="error"></p>

            <fieldset>

                <legend>Modalidad:</legend>

                <label>
                    <input
                        type="radio"
                        name="modalidad"
                        value="Mensual"
                        required
                    >
                    Mensual
                </label>

                <label>
                    <input
                        type="radio"
                        name="modalidad"
                        value="Anual"
                    >
                    Anual
                </label>

                <p id="errorModalidad" class="error"></p>

            </fieldset>

            <label for="contrasena">Contraseña:</label>
            <input
                type="password"
                id="contrasena"
                name="password"
                minlength="8"
                maxlength="16"
                required
                aria-describedby="errorPassword"
            >
            <p id="errorPassword" class="error"></p>

            <label for="confirmacion">Confirmar contraseña:</label>
            <input
                type="password"
                id="confirmacion"
                name="confirmacion"
                required
                aria-describedby="errorConfirmacion"
            >
            <p id="errorConfirmacion" class="error"></p>

            <label for="telefono">Teléfono:</label>
            <input
                type="tel"
                id="telefono"
                name="telefono"
                required
                aria-describedby="errorTelefono"
            >
            <p id="errorTelefono" class="error"></p>

            <label for="foto">Foto JPEG de 5 MB:</label>
            <input
                type="file"
                id="foto"
                name="foto"
                accept="image/jpeg"
                required
                aria-describedby="errorFoto"
            >
            <p id="errorFoto" class="error"></p>

            <label>
                <input
                    type="checkbox"
                    id="condiciones"
                    name="condiciones"
                    required
                >
                Acepto las condiciones
            </label>

            <p id="errorCondiciones" class="error"></p>

            <button type="submit">Registrar socio</button>

        </form>

        <div id="resultado"></div>

    </section>

    <section>

        <h2>Formulario de servicios</h2>

        <form id="formServicios" novalidate>

            <label for="nombreServicio">Nombre del servicio:</label>
            <input
                type="text"
                id="nombreServicio"
                name="nombreServicio"
                minlength="3"
                maxlength="50"
                required
                aria-describedby="errorNombreServicio"
            >
            <p id="errorNombreServicio" class="error"></p>

            <label for="codigoServicio">Código del servicio:</label>
            <input
                type="text"
                id="codigoServicio"
                name="codigoServicio"
                required
                aria-describedby="errorCodigoServicio"
            >
            <p id="errorCodigoServicio" class="error"></p>

            <label for="duracion">Duración (minutos):</label>
            <input
                type="number"
                id="duracion"
                name="duracion"
                min="15"
                step="15"
                required
                aria-describedby="errorDuracion"
            >
            <p id="errorDuracion" class="error"></p>

            <label for="precio">Precio:</label>
            <input
                type="number"
                id="precio"
                name="precio"
                min="0"
                max="9999.99"
                step="0.01"
                required
                aria-describedby="errorPrecio"
            >
            <p id="errorPrecio" class="error"></p>

            <label for="categoria">Categoría:</label>
            <select
                id="categoria"
                name="categoria"
                required
                aria-describedby="errorCategoria"
            >
                <option value="">Selecciona una categoría</option>
                <option value="Fitness">Fitness</option>
                <option value="Salud">Salud</option>
                <option value="Relajación">Relajación</option>
            </select>

            <p id="errorCategoria" class="error"></p>

            <button type="submit">Añadir servicio</button>

        </form>

        <div id="resultadoServicios"></div>

    </section>

    <section>

        <h2>Formulario de testimonios</h2>

        <form id="formTestimonios" novalidate>

            <label for="autorTestimonio">Autor:</label>
            <input
                type="text"
                id="autorTestimonio"
                name="autor"
                minlength="2"
                maxlength="50"
                required
                aria-describedby="errorAutor"
            >
            <p id="errorAutor" class="error"></p>

            <label for="textoTestimonio">Testimonio:</label>
            <textarea
                id="textoTestimonio"
                name="testimonio"
                minlength="10"
                maxlength="500"
                required
                aria-describedby="errorTestimonio contador"
            ></textarea>

            <p id="errorTestimonio" class="error"></p>

            <p id="contador">0 / 500 caracteres</p>

            <label>
                <input
                    type="checkbox"
                    id="autorizacion"
                    name="autorizacion"
                >
                Autorizo su publicación
            </label>

            <button type="submit">Enviar testimonio</button>

        </form>

        <div id="resultadoTestimonios"></div>

        <h3>Buscar números en un testimonio</h3>

        <label for="textoBusqueda">Texto:</label>
        <input
            type="text"
            id="textoBusqueda"
        >

        <button type="button" id="buscarNumeros">
            Buscar números
        </button>

        <p id="resultadoNumeros"></p>

    </section>

    <section>

        <h2>Formulario de noticias</h2>

        <form id="formNoticias" novalidate>

            <label for="tituloNoticia">Título:</label>
            <input
                type="text"
                id="tituloNoticia"
                name="titulo"
                minlength="3"
                maxlength="100"
                required
                aria-describedby="errorTitulo"
            >
            <p id="errorTitulo" class="error"></p>

            <label for="contenidoNoticia">Contenido:</label>
            <textarea
                id="contenidoNoticia"
                name="contenido"
                minlength="20"
                maxlength="2000"
                required
                aria-describedby="errorContenido"
            ></textarea>

            <p id="errorContenido" class="error"></p>

            <label for="fechaPublicacion">Fecha de publicación:</label>
            <input
                type="date"
                id="fechaPublicacion"
                name="fecha"
                required
                aria-describedby="errorFecha"
            >
            <p id="errorFecha" class="error"></p>

            <label for="imagenNoticia">Imagen JPEG:</label>
            <input
                type="file"
                id="imagenNoticia"
                name="imagen"
                accept="image/jpeg"
                required
                aria-describedby="errorImagen"
            >
            <p id="errorImagen" class="error"></p>

            <label for="etiquetasNoticia">Etiquetas (separadas por comas):</label>
            <input
                type="text"
                id="etiquetasNoticia"
                name="etiquetas"
            >

            <button type="submit">Publicar noticia</button>

        </form>

        <div id="resultadoNoticias"></div>

    </section>

    <section>

        <h2>Formulario de citas</h2>

        <form id="formCitas" novalidate>

            <label for="socioCita">Socio:</label>

            <select
                id="socioCita"
                name="socio"
                required
                aria-describedby="errorSocio"
            >
                <option value="">Selecciona un socio</option>
                <option value="Ana García">Ana García</option>
                <option value="Carlos López">Carlos López</option>
                <option value="María Sánchez">María Sánchez</option>
            </select>

            <p id="errorSocio" class="error"></p>


            <label for="servicioCita">Servicio:</label>

            <select
                id="servicioCita"
                name="servicio"
                required
                aria-describedby="errorServicioCita"
            >
                <option value="">Selecciona un servicio</option>
                <option value="Yoga">Yoga</option>
                <option value="Pilates">Pilates</option>
                <option value="Entrenamiento personal">Entrenamiento personal</option>
            </select>

            <p id="errorServicioCita" class="error"></p>


            <label for="referenciaCita">Referencia de la cita:</label>
            <input
                type="text"
                id="referenciaCita"
                name="referencia"
                required
                aria-describedby="errorReferenciaCita"
            >

            <p id="errorReferenciaCita" class="error"></p>


            <label for="fechaCita">Fecha y hora:</label>

            <input
                type="datetime-local"
                id="fechaCita"
                name="fecha"
                required
                aria-describedby="errorFechaCita"
            >

            <p id="errorFechaCita" class="error"></p>


            <label>
                <input
                    type="checkbox"
                    id="confirmacionCita"
                    name="confirmacion"
                    required
                >
                He revisado los datos de la cita
            </label>

            <p id="errorConfirmacionCita" class="error"></p>


            <button type="submit">Reservar cita</button>

        </form>

        <div id="resultadoCitas"></div>

    </section>

    <section>

        <h2>Demostración de pattern</h2>

        <form id="formPattern">

            <label for="codigoPattern">Código del servicio:</label>

            <input
                type="text"
                id="codigoPattern"
                name="codigoPattern"
                required
                pattern="DEP-[0-9]{3}"
                title="El código debe tener el formato DEP- seguido de 3 números"
            >

            <button type="submit">Comprobar código</button>

        </form>

        <p id="resultadoPattern"></p>

    </section>

</body>
</html>
