<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Videojuegos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            margin: 0;
            padding: 20px;
            color: #263238;
        }

        header {
            background-color: #315caa;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
        }

        h2 {
            color: #315caa;
            font-size: 20px;
            margin-top: 0;
        }

        .seccion {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px #00000010;
        }

        .lista-juegos {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .juego {
            background-color: #eef4ff;
            border: 1px solid #cbdaf7;
            border-radius: 8px;
            padding: 15px;
            flex: 1 1 200px;
        }

        .juego h3 {
            margin-top: 0;
            color: #244b91;
        }

        .resultados {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }

        .resultado {
            background-color: white;
            border-radius: 8px;
            border-left: 5px solid #315caa;
            padding: 15px;
            box-shadow: 0 2px 6px #00000010;
        }

        .resultado h2 {
            font-size: 17px;
        }

        .valor {
            font-weight: bold;
            color: #237447;
        }

        .lista-simple {
            margin: 0;
            padding-left: 20px;
        }

        code {
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 Gestión de Videojuegos</h1>
    
    </header>

    <div id="resultado"></div>

    <script type="module" src="app.js"></script>

</body>
</html>
